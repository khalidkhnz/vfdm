[workspace]
resolver = "2"
members = ["crates/vfdm-engine"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/khalidkhnz/vfdm"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "charset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
url = "2"
bytes = "1"
rand = "0.9"
futures-util = "0.3"
axum = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
