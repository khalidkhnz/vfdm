<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>vfdm options</title>
    <style>
      :root { color-scheme: light dark; }
      body { font: 14px/1.45 system-ui, sans-serif; max-width: 640px; margin: 32px auto; padding: 0 16px; }
      h1 { font-size: 18px; margin: 0 0 4px; }
      .sub { color: #777; margin: 0 0 20px; }
      fieldset { border: 1px solid #8884; border-radius: 8px; padding: 12px 16px; margin: 0 0 16px; }
      legend { padding: 0 6px; font-weight: 600; }
      label { display: block; margin: 10px 0 4px; font-weight: 500; }
      input[type=text], input[type=password], input[type=number], textarea, select {
        width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #8886; border-radius: 6px; font: inherit; background: transparent; color: inherit;
      }
      textarea { font-family: ui-monospace, monospace; font-size: 12px; min-height: 64px; }
      .row { display: flex; gap: 8px; align-items: center; }
      .row input[type=checkbox] { margin: 0; }
      .hint { color: #888; font-size: 12px; margin-top: 4px; }
      button { padding: 7px 14px; border-radius: 6px; border: 1px solid #8886; background: transparent; color: inherit; cursor: pointer; font: inherit; }
      button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
      #status { margin-left: 8px; font-size: 13px; }
      .ok { color: #16a34a; } .bad { color: #dc2626; }
    </style>
  </head>
  <body>
    <h1>vfdm extension</h1>
    <p class="sub">Captured downloads are sent to the vfdm desktop app on this machine.</p>

    <fieldset>
      <legend>Connection</legend>
      <div class="row"><input type="checkbox" id="enabled" /><label for="enabled" style="margin:0">Capture downloads</label></div>
      <label for="token">Pairing token</label>
      <input type="password" id="token" autocomplete="off" spellcheck="false" />
      <div class="hint">vfdm app → Settings → Browser extension pairing → Copy.</div>
      <label for="port">Port</label>
      <input type="number" id="port" min="0" max="65535" />
      <div class="hint">0 = auto-detect (7800–7810).</div>
      <div class="row" style="margin-top:12px">
        <button id="test">Test connection</button><span id="status"></span>
      </div>
    </fieldset>

    <fieldset>
      <legend>What to capture</legend>
      <label for="extensions">File extensions (comma separated, empty = everything)</label>
      <textarea id="extensions"></textarea>
      <label for="minSize">Minimum size (MB, 0 = any)</label>
      <input type="number" id="minSize" min="0" step="1" />
      <label for="skipHosts">Never capture from these hosts (one per line)</label>
      <textarea id="skipHosts" placeholder="example.com"></textarea>
      <label for="offline">If the vfdm app is not running</label>
      <select id="offline">
        <option value="browser">Let the browser download it</option>
        <option value="block">Block the download and notify me</option>
      </select>
      <div class="row" style="margin-top:12px"><input type="checkbox" id="notify" /><label for="notify" style="margin:0">Show notifications</label></div>
    </fieldset>

    <div class="row">
      <button class="primary" id="save">Save</button>
      <span id="saved" class="ok"></span>
    </div>
    <script type="module" src="/src/options.ts"></script>
  </body>
</html>
