<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root { color-scheme: light dark; }
      body { font: 13px/1.4 system-ui, sans-serif; width: 240px; margin: 0; padding: 12px; }
      .row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #9ca3af; }
      .dot.on { background: #16a34a; } .dot.off { background: #dc2626; }
      button { width: 100%; padding: 6px; border-radius: 6px; border: 1px solid #8886; background: transparent; color: inherit; cursor: pointer; font: inherit; margin-top: 6px; }
      label { display: flex; align-items: center; gap: 8px; }
    </style>
  </head>
  <body>
    <div class="row"><span class="dot" id="dot"></span><span id="text">Checking…</span></div>
    <label><input type="checkbox" id="enabled" /> Capture downloads</label>
    <button id="options">Options</button>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
